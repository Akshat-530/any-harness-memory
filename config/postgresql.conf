# PostgreSQL - canonical store: memory records, versions, graph edges, audit log
# Units are EXPLICIT everywhere (the old config's bare numbers were 8kB
# blocks - shared_buffers=2048 meant 16MB, not 2GB)
listen_addresses = '*'

# Memory (right-sized for an 11.7GB WSL VM shared with redis/qdrant/12 MCPs)
shared_buffers = 512MB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
temp_buffers = 16MB
huge_pages = try

# WAL: durability first - this holds the canonical memory records
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 1GB
synchronous_commit = on
wal_compression = on
full_page_writes = on

# Planner / I/O: SSD-style assumptions
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Housekeeping: memory records churn (updates, dedup) - vacuum promptly
autovacuum = on
autovacuum_max_workers = 3
autovacuum_vacuum_cost_delay = 2
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_threshold = 50

# Connections: memory pools a handful; 100 leaves headroom, each slot
# is real memory (300 was 3x overkill)
max_connections = 100
temp_file_limit = 1GB

# Observability: slow queries only, no statement spam
log_statement = none
log_min_duration_statement = 500ms
log_lock_waits = on
track_io_timing = on

# Parallelism: 4 total workers - this box also runs 12 MCPs + framework
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# JIT helps only long analytical queries; memory does point lookups
jit = off

hba_file = '/etc/postgresql/pg_hba.conf'
