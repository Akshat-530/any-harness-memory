# Redis - short-term session store, caches, dedup trackers, outbox coordination
# Right-sized for the memory MCP on an 11.7GB WSL2 VM (real usage ~15MB)
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 300
daemonize no

# Performance (2 io-threads is plenty at this load; 4 wasted threads)
io-threads 2

# Memory: hard ceiling so a runaway can never starve the WSL VM
# (compose enforces mem_limit 1g as a second guard)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Persistence: AOF everysec is the durability floor for short-term
# memory; RDB snapshots kept as a cheap secondary restore point
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Lazy freeing keeps latency flat when TTLs expire in bulk
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Client limits: a handful of MCP connections + pool overhead
maxclients 512

loglevel notice
databases 16
